<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Bác sĩ - MediBook</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;
        }

        .nav-link.active {
            border-bottom: 2px solid #2563eb;
            color: #2563eb;
        }

        .nav-link:not(.active) {
            border-bottom: 2px solid transparent;
            color: #6b7280;
        }

        .nav-link:not(.active):hover {
            color: #111827;
            border-bottom-color: #d1d5db;
        }

        .stat-card {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .appointment-row:hover {
            background-color: #f3f4f6;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 16px 24px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.success {
            border-left: 4px solid #10b981;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">MediBook</h1>
                        <p class="text-xs text-gray-500">Hệ thống đặt lịch thông minh</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex gap-1 overflow-x-auto">
                <a href="index.html"
                    class="nav-link flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    Đặt lịch khám
                </a>
                <a href="my-appointments.html"
                    class="nav-link flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Lịch hẹn của tôi
                </a>
                <a href="doctor-dashboard.html"
                    class="nav-link active flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                    Bác sĩ
                </a>
                <a href="doctor-schedule.html"
                    class="nav-link flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Lịch làm việc
                </a>
                <a href="admin-dashboard.html"
                    class="nav-link flex items-center gap-2 px-4 py-3 text-sm font-medium transition-colors whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
                    </svg>
                    Thống kê
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-6">
            <h1 class="text-3xl font-bold mb-2">Dashboard Bác sĩ</h1>
            <p class="text-gray-600">Quản lý lịch khám và bệnh nhân</p>
        </div>

        <!-- Doctor selector -->
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Chọn bác sĩ</label>
            <select id="doctor-select" onchange="loadDoctorData()"
                class="w-full max-w-md px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="1">BS. Nguyễn Văn An - Tim mạch</option>
                <option value="2">TS.BS. Trần Thị Bình - Nội tiết</option>
                <option value="3">BS. Lê Hoàng Cường - Da liễu</option>
                <option value="4">TS.BS. Phạm Thị Dung - Tim mạch</option>
                <option value="5">BS. Võ Minh Em - Nhi khoa</option>
            </select>
        </div>

        <!-- Stats cards -->
        <div class="grid md:grid-cols-4 gap-4 mb-8">
            <div class="stat-card bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Hôm nay</p>
                        <p class="text-3xl font-bold text-blue-600" id="stat-today">2</p>
                    </div>
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
            </div>

            <div class="stat-card bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Sắp tới</p>
                        <p class="text-3xl font-bold text-green-600" id="stat-upcoming">3</p>
                    </div>
                    <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
            </div>

            <div class="stat-card bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Đánh giá</p>
                        <p class="text-3xl font-bold text-yellow-600" id="stat-rating">4.9 ⭐</p>
                    </div>
                    <svg class="w-10 h-10 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>

            <div class="stat-card bg-white rounded-xl shadow-sm p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-600 mb-1">Tổng đánh giá</p>
                        <p class="text-3xl font-bold text-purple-600" id="stat-review-count">234</p>
                    </div>
                    <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Today's appointments -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">Lịch hẹn hôm nay</h2>
            <div id="today-appointments" class="space-y-3">
                <!-- Will be loaded by JavaScript -->
            </div>
        </div>

        <!-- Upcoming appointments -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="text-xl font-bold mb-4">Lịch hẹn sắp tới</h2>
            <div id="upcoming-appointments" class="space-y-3">
                <!-- Will be loaded by JavaScript -->
            </div>
        </div>
    </main>

    <script>
        const doctorData = {
            '1': {
                name: 'BS. Nguyễn Văn An',
                rating: 4.9,
                reviewCount: 234,
                todayAppointments: [
                    {
                        id: 'apt-1',
                        patientName: 'Nguyễn Văn A',
                        reason: 'Khám tổng quát tim mạch',
                        time: '09:00',
                        duration: 30
                    },
                    {
                        id: 'apt-2',
                        patientName: 'Lê Văn C',
                        reason: 'Đau ngực, khó thở',
                        time: '14:00',
                        duration: 30
                    }
                ],
                upcomingAppointments: [
                    {
                        id: 'apt-3',
                        patientName: 'Trần Văn D',
                        reason: 'Tái khám sau phẫu thuật',
                        date: '2026-04-16',
                        time: '09:00',
                        queuePosition: 1
                    },
                    {
                        id: 'apt-4',
                        patientName: 'Phạm Thị E',
                        reason: 'Khám định kỳ',
                        date: '2026-04-17',
                        time: '10:30',
                        queuePosition: 2
                    },
                    {
                        id: 'apt-5',
                        patientName: 'Hoàng Văn F',
                        reason: 'Đau tim, khó thở',
                        date: '2026-04-18',
                        time: '08:00',
                        queuePosition: 1
                    }
                ]
            },
            '2': {
                name: 'TS.BS. Trần Thị Bình',
                rating: 4.8,
                reviewCount: 189,
                todayAppointments: [],
                upcomingAppointments: [
                    {
                        id: 'apt-6',
                        patientName: 'Nguyễn Thị G',
                        reason: 'Tái khám đái tháo đường',
                        date: '2026-04-16',
                        time: '08:00',
                        queuePosition: 1
                    }
                ]
            },
            '3': {
                name: 'BS. Lê Hoàng Cường',
                rating: 4.7,
                reviewCount: 156,
                todayAppointments: [
                    {
                        id: 'apt-7',
                        patientName: 'Võ Văn H',
                        reason: 'Mụn trứng cá',
                        time: '09:30',
                        duration: 30
                    }
                ],
                upcomingAppointments: []
            },
            '4': {
                name: 'TS.BS. Phạm Thị Dung',
                rating: 4.9,
                reviewCount: 312,
                todayAppointments: [],
                upcomingAppointments: [
                    {
                        id: 'apt-8',
                        patientName: 'Lê Thị I',
                        reason: 'Khám tim mạch',
                        date: '2026-04-16',
                        time: '14:00',
                        queuePosition: 1
                    },
                    {
                        id: 'apt-9',
                        patientName: 'Nguyễn Văn J',
                        reason: 'Đau ngực',
                        date: '2026-04-17',
                        time: '08:30',
                        queuePosition: 1
                    }
                ]
            },
            '5': {
                name: 'BS. Võ Minh Em',
                rating: 4.8,
                reviewCount: 201,
                todayAppointments: [],
                upcomingAppointments: [
                    {
                        id: 'apt-10',
                        patientName: 'Hoàng Văn K',
                        reason: 'Khám sức khỏe định kỳ cho bé',
                        date: '2026-04-17',
                        time: '08:30',
                        queuePosition: 1
                    }
                ]
            }
        };

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<p class="font-semibold">${message}</p>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function loadDoctorData() {
            const doctorId = document.getElementById('doctor-select').value;
            const data = doctorData[doctorId];

            // Update stats
            document.getElementById('stat-today').textContent = data.todayAppointments.length;
            document.getElementById('stat-upcoming').textContent = data.upcomingAppointments.length;
            document.getElementById('stat-rating').textContent = `${data.rating} ⭐`;
            document.getElementById('stat-review-count').textContent = data.reviewCount;

            // Render today's appointments
            const todayContainer = document.getElementById('today-appointments');
            if (data.todayAppointments.length === 0) {
                todayContainer.innerHTML = '<p class="text-gray-500 text-center py-8">Không có lịch hẹn nào hôm nay</p>';
            } else {
                todayContainer.innerHTML = data.todayAppointments.map((apt, idx) => `
                    <div class="appointment-row flex items-center justify-between p-4 bg-gray-50 rounded-lg transition-colors">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center">
                                <span class="text-lg font-bold text-blue-600">${idx + 1}</span>
                            </div>
                            <div>
                                <h3 class="font-semibold">${apt.patientName}</h3>
                                <p class="text-sm text-gray-600">${apt.reason}</p>
                                <div class="flex items-center gap-4 mt-1 text-sm text-gray-500">
                                    <span class="flex items-center gap-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                        </svg>
                                        ${apt.time}
                                    </span>
                                    <span>${apt.duration} phút</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="completeAppointment('${apt.id}')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors flex items-center gap-2 text-sm font-medium">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                Hoàn thành
                            </button>
                            <button onclick="cancelAppointment('${apt.id}')" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors flex items-center gap-2 text-sm font-medium">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                                Hủy
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // Render upcoming appointments
            const upcomingContainer = document.getElementById('upcoming-appointments');
            if (data.upcomingAppointments.length === 0) {
                upcomingContainer.innerHTML = '<p class="text-gray-500 text-center py-8">Không có lịch hẹn sắp tới</p>';
            } else {
                upcomingContainer.innerHTML = data.upcomingAppointments.map(apt => `
                    <div class="appointment-row flex items-center justify-between p-4 border border-gray-200 rounded-lg transition-colors">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h3 class="font-semibold">${apt.patientName}</h3>
                                <span class="px-2 py-0.5 bg-blue-100 text-blue-700 text-xs font-medium rounded-full">
                                    Vị trí ${apt.queuePosition}
                                </span>
                            </div>
                            <p class="text-sm text-gray-600 mb-2">${apt.reason}</p>
                            <div class="flex items-center gap-4 text-sm text-gray-500">
                                <span class="flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                    </svg>
                                    ${apt.date}
                                </span>
                                <span class="flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    ${apt.time}
                                </span>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="cancelAppointment('${apt.id}')" class="px-3 py-1.5 text-sm text-red-600 border border-red-300 rounded-lg hover:bg-red-50 transition-colors">
                                Hủy lịch
                            </button>
                        </div>
                    </div>
                `).join('');
            }
        }

        function completeAppointment(id) {
            showToast('Đã đánh dấu hoàn thành lịch hẹn');
            loadDoctorData();
        }

        function cancelAppointment(id) {
            if (confirm('Bạn có chắc muốn hủy lịch hẹn này? Hệ thống sẽ tự động gửi email gợi ý lịch mới cho bệnh nhân.')) {
                showToast('Đã hủy lịch hẹn. Email gợi ý lịch mới đã được gửi cho bệnh nhân.');
                loadDoctorData();
            }
        }

        // Initialize
        loadDoctorData();
    </script>
</body>

</html>
